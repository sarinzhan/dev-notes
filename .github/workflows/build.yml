name: Build notes index
on:
  push:
    branches: [main]
    paths: ["notes/**", "sections.json", "build.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 build.py
      - name: Commit generated files
        run: |
          git config user.name "notes-bot"
          git config user.email "notes-bot@users.noreply.github.com"
          git add notes.json graph.json
          git diff --cached --quiet || git commit -m "chore: rebuild notes index"
          git push
