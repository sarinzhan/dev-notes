    { t: ["Load: translate", "Загрузка: трансляция"], ins: "ldr r0, [0x7ffd1044]", at: "tlb", lat: 1, en: "The core executes a load. The address in the instruction is virtual, so the MMU first translates it with the TLB: 0x7ffd1044 is physical 0x31044. A TLB hit costs about a cycle.", ru: "Ядро выполняет загрузку. Адрес в инструкции виртуальный, поэтому MMU сначала транслирует его через TLB: 0x7ffd1044 — это физический 0x31044. Попадание в TLB стоит около такта." },
    { t: ["L1 miss", "Промах L1"], ins: "ldr r0, [0x7ffd1044]", at: "l1", miss: ["l1"], lat: 1, en: "L1 is checked for the cache line that contains 0x31044, which is the 64-byte line 0x31040–0x3107F. It is not there: a miss.", ru: "L1 ищет кэш-линию, в которой лежит 0x31044, — это 64-байтная линия 0x31040–0x3107F. Её там нет: промах." },
    { t: ["L2 and L3 miss", "Промахи L2 и L3"], ins: "ldr r0, [0x7ffd1044]", at: "l3", miss: ["l1", "l2", "l3"], lat: 40, en: "L2 (about 4 ns) and the shared L3 (about 12–40 ns) miss too. Now the request leaves the CPU core for the memory controller.", ru: "L2 (около 4 нс) и общий L3 (около 12–40 нс) тоже промахиваются. Запрос уходит из ядра в контроллер памяти." },
    { t: ["Activate the row", "Открытие строки"], ins: "ldr r0, [0x7ffd1044]", at: "row", miss: ["l1", "l2", "l3"], row: true, lat: 70, en: "DRAM is a grid of capacitors in banks, rows and columns. The memory controller sends ACTIVATE: the whole row (about 8 KB) that holds the address is copied into the bank's row buffer. Reading a capacitor drains it, so the row is written back later.", ru: "DRAM — это сетка конденсаторов, разбитая на банки, строки и столбцы. Контроллер памяти посылает ACTIVATE: вся строка (около 8 КБ), где лежит адрес, копируется в буфер строки банка. Чтение разряжает конденсатор, поэтому строка позже записывается обратно." },
    { t: ["Burst: 64 bytes", "Пакет: 64 байта"], ins: "ldr r0, [0x7ffd1044]", at: "burst", miss: ["l1", "l2", "l3"], row: true, lat: 90, en: "READ selects the columns: the 64-byte line is sent over the memory bus in a burst of 8 transfers of 8 bytes. The CPU never reads a single byte from RAM; it always reads a whole cache line.", ru: "READ выбирает столбцы: 64-байтная линия идёт по шине памяти пакетом из 8 передач по 8 байт. CPU никогда не читает из RAM один байт; он всегда читает целую кэш-линию." },
    { t: ["Fill and return", "Заполнение и ответ"], ins: "ldr r0, [0x7ffd1044]", at: "fill", fill: ["l1", "l2", "l3"], row: true, r0: "42", lat: 100, en: "The line is stored in L3, L2 and L1, and the 4 bytes at 0x31044 go into r0. About 100 ns in total: roughly 300 cycles in which this instruction waited.", ru: "Линия сохраняется в L3, L2 и L1, а 4 байта по адресу 0x31044 попадают в r0. Всего около 100 нс — примерно 300 тактов, которые эта инструкция ждала." },
    { t: ["Next load: L1 hit", "Следующая загрузка: попадание в L1"], ins: "ldr r1, [0x7ffd1048]", at: "hit", fill: ["l1", "l2", "l3"], r0: "42", r1: "7", lat: 1, en: "The next variable, 0x31048, is in the same line, so it is an L1 hit in about 1 ns. That is spatial locality: arrays and fields that sit next to each other are almost free after the first access.", ru: "Следующая переменная, 0x31048, в той же линии, поэтому это попадание в L1 примерно за 1 нс. Это пространственная локальность: соседние элементы массива и поля почти бесплатны после первого обращения." },
    { t: ["Store: write-back", "Запись: write-back"], ins: "str r1, [0x7ffd1050]", at: "store", fill: ["l1", "l2", "l3"], dirty: true, r0: "42", r1: "7", lat: 1, en: "A store goes into the L1 line only, and the line is marked dirty. RAM still holds the old value. Other cores still see the new one, because cache coherence (MESI) moves the line between caches.", ru: "Запись попадает только в линию L1, и линия помечается как грязная (dirty). В RAM пока старое значение. Другие ядра всё равно увидят новое: когерентность кэшей (MESI) передаёт линию между кэшами." },
    { t: ["Eviction writes back", "Вытеснение и запись"], ins: "…", at: "evict", fill: ["l2", "l3"], r0: "42", r1: "7", lat: 0, en: "Later the line is evicted to make room. Because it is dirty, the whole 64 bytes are written back to DRAM in one burst. Writes are batched per line, not per variable.", ru: "Позже линия вытесняется, чтобы освободить место. Раз она грязная, все 64 байта записываются в DRAM одним пакетом. Записи группируются по линиям, а не по переменным." },
    { t: ["Alignment", "Выравнивание"], ins: "ldr x2, [0x7ffd107c]", at: "align", fill: ["l2", "l3"], align: true, r0: "42", r1: "7", lat: 200, en: "An 8-byte value at 0x3107C crosses the boundary at 0x31080, so it spans two lines: two fetches, and the read cannot be atomic. Compilers align each type to its size (4-byte int at an address divisible by 4, 8-byte long at one divisible by 8), so a value never straddles a line.", ru: "8-байтное значение по адресу 0x3107C пересекает границу 0x31080 и занимает две линии: две выборки, и чтение не может быть атомарным. Компиляторы выравнивают каждый тип по его размеру (4-байтный int — по адресу, кратному 4, 8-байтный long — кратному 8), поэтому значение никогда не пересекает линию." }
  ];
  const BOX = { core: [12, 96, 136, 150], l1: [176, 120, 82, 102], l2: [276, 120, 82, 102], l3: [376, 120, 82, 102], mc: [478, 120, 82, 102], dram: [584, 60, 166, 186] };
  const cx = b => BOX[b][0] + BOX[b][2] / 2, cy = b => BOX[b][1] + BOX[b][3] / 2;
  return steppedAnim(el, { title: LL("How the CPU reads and writes RAM", "Как CPU читает и пишет в RAM"), vb: [760, 336], steps: ST, render(g, s, t){
    const k = easeIO(Math.min(1, t / 1400));
    // core

    oT(g, x + 8, y + 18, s.ins, "an-code", "start");
    [["r0", s.r0], ["r1", s.r1]].forEach(([n, v], i)=>{ oR(g, x + 8 + i * 62, y + 30, 56, 40, "an-reg" + ((s.at === "fill" && n === "r0") || (s.at === "hit" && n === "r1") ? " on" : ""), 6); oT(g, x + 14 + i * 62, y + 42, n, "an-m", "start"); oT(g, x + 36 + i * 62, y + 63, v || "", "an-mid"); });
    oR(g, x + 8, y + 82, w - 16, 54, "an-reg" + (s.at === "tlb" ? " on" : ""), 6);
    oT(g, x + 14, y + 96, "MMU · TLB", "an-m", "start");
    oT(g, x + w / 2, y + 113, "0x7ffd1… →", "an-m"); oT(g, x + w / 2, y + 128, "0x31…", "an-m");
    // caches
    const lat = { l1: "~1 ns", l2: "~4 ns", l3: "~12–40 ns" };
    for(const c of ["l1", "l2", "l3"]){
      const [bx, by, bw, bh] = BOX[c], miss = (s.miss || []).includes(c), fill = (s.fill || []).includes(c);
      oR(g, bx, by, bw, bh, (s.at === c || (s.at === "hit" && c === "l1") ? "an-reg on" : "an-box"), 8);
      oT(g, bx + bw / 2, by - 8, c.toUpperCase(), "an-m an-b"); oT(g, bx + bw / 2, by + bh + 14, lat[c], "an-m");
      if(fill){ oR(g, bx + 8, by + 22, bw - 16, 36, "an-slot k1" + (c === "l1" && s.dirty ? " an-hlslot" : ""), 4); oT(g, bx + bw / 2, by + 38, "0x31040", "an-m"); oT(g, bx + bw / 2, by + 52, c === "l1" && s.dirty ? LL("dirty", "грязная") : "64 B", "an-m" + (c === "l1" && s.dirty ? " an-b an-warn" : "")); }
      else if(miss) oT(g, bx + bw / 2, by + 46, LL("miss", "промах"), "an-t an-b an-warn");
    }
    // memory controller + DRAM
    { const [bx, by, bw, bh] = BOX.mc; oR(g, bx, by, bw, bh, "an-box", 8); oT(g, bx + bw / 2, by + 38, LL("memory", "контроллер"), "an-m"); oT(g, bx + bw / 2, by + 52, LL("controller", "памяти"), "an-m"); }
    { const [bx, by, bw, bh] = BOX.dram; oR(g, bx, by, bw, bh, "an-frame", 10); oT(g, bx + bw / 2, by - 8, "DRAM (DIMM)", "an-m an-b");
      for(let b = 0; b < 2; b++){ const X = bx + 10 + b * 78; oR(g, X, by + 14, 70, 112, "an-box", 4); oT(g, X + 35, by + 28, LL(`bank ${b}`, `банк ${b}`), "an-m");
        for(let r = 0; r < 7; r++) oR(g, X + 6, by + 36 + r * 12, 58, 9, b === 1 && r === 3 && s.row ? "an-slot k1 an-hlslot" : "an-free", 2); }
      oR(g, bx + 78, by + 134, 84, 20, s.row ? "an-slot k1" : "an-free", 3); oT(g, bx + 120, by + 148, LL("row buffer", "буфер строки"), "an-m");
      oT(g, bx + 10, by + 162, LL("rows ≈ 8 KB", "строка ≈ 8 КБ"), "an-m", "start"); oT(g, bx + 10, by + 176, LL("refresh every 64 ms", "регенерация раз в 64 мс"), "an-m", "start"); }
    // buses
    const busY = 208; for(const [x1, x2] of [[148, 176], [258, 276], [358, 376], [458, 478], [560, 584]]) E(g, "line", { x1, y1: busY, x2, y2: busY, class: "an-flowline" });
    // moving data
    const P = { core: [148, busY], l1: [217, busY], l2: [317, busY], l3: [417, busY], mc: [519, busY], dram: [672, 226] };
    let path = null, back = false, n = 1;
    if(s.at === "l1") path = [P.core, P.l1]; if(s.at === "l3") path = [P.l1, P.l2, P.l3, P.mc];
    if(s.at === "row") path = [P.mc, [672, busY], [672, 120]];
    if(s.at === "burst"){ path = [[672, 196], [672, busY], P.mc]; n = 8; }
    if(s.at === "fill"){ path = [P.mc, P.l3, P.l2, P.l1, P.core]; }
    if(s.at === "hit"){ path = [P.l1, P.core]; }
    if(s.at === "store"){ path = [P.core, P.l1]; }
    if(s.at === "evict"){ path = [P.l1, P.l2, P.l3, P.mc, [672, busY], [672, 196]]; }
    if(s.at === "align"){ path = [P.mc, P.l3, P.l2, P.l1, P.core]; n = 2; }
    if(path) for(let j = 0; j < n; j++){ const kk = k - j * (n === 8 ? .07 : .25); if(kk <= 0) continue; const [px, py] = polyAt(path, kk); E(g, "circle", { cx: px, cy: py, r: n === 8 ? 4 : 6, class: "an-dot an-flow" }); }
    // the cache line, bytes
    const LX = 176, LY = 268, BW = 7.4;
    oT(g, LX - 6, LY + 12, LL("line 0x31040:", "линия 0x31040:"), "an-m", "end");
    for(let b = 0; b < 16; b++){
      const a = 0x31040 + b * 4, on = (s.at !== "tlb" && s.at !== "l1" && s.at !== "l3" && s.at !== "row") && ((a === 0x31044 && ["fill", "burst"].includes(s.at)) || (a === 0x31048 && s.at === "hit") || (a === 0x31050 && (s.at === "store" || s.at === "evict")) || (s.align && a >= 0x3107c));
      oR(g, LX + b * 4 * BW, LY, 4 * BW - 2, 18, on ? "an-slot k0 an-hlslot" : "an-slot", 2);
    }
    oT(g, LX, LY + 34, "0x31040", "an-m", "start"); oT(g, LX + 64 * BW, LY + 34, "0x31080", "an-m", "end");
    if(s.align){ oR(g, LX + 64 * BW + 4, LY, 4 * BW - 2, 18, "an-slot k0 an-hlslot", 2); oT(g, LX + 64 * BW + 4 + 2 * BW, LY - 6, LL("next line", "след. линия"), "an-m an-warn"); }
    oT(g, 750, 326, LL(`this access ≈ ${s.lat} ns`, `это обращение ≈ ${s.lat} нс`), "an-m an-b", "end");
  }});
};

// ============ 16. External vs internal fragmentation; why paging solves external
ANIMS["memory-fragmentation"] = el=>{
  const C = { A: "k0", B: "k2", C: "k1", D: "k3", E: "k4" };
  const ST = [
    { t: ["Contiguous allocation", "Непрерывное выделение"], blocks: [["A", 0, 12], ["B", 12, 8], ["C", 20, 12], ["D", 32, 4]],
      en: "Without virtual memory, each process must sit in one contiguous range of physical memory. A, B, C and D are loaded one after another; 4 KB is left free at the end.",
      ru: "Без виртуальной памяти каждый процесс должен занимать один непрерывный диапазон физической памяти. A, B, C и D загружены друг за другом; в конце осталось 4 КБ." },
    { t: ["B exits", "B завершается"], blocks: [["A", 0, 12], ["C", 20, 12], ["D", 32, 4]], hole: [12, 8],
      en: "B exits and leaves an 8 KB hole between A and C. Free memory is now 12 KB in total, in two pieces.",
      ru: "B завершается и оставляет дыру в 8 КБ между A и C. Свободно теперь 12 КБ, но двумя кусками." },
    { t: ["External fragmentation", "Внешняя фрагментация"], blocks: [["A", 0, 12], ["C", 20, 12], ["D", 32, 4]], want: 12,
      en: "E needs 12 KB. In total exactly 12 KB is free, but the largest contiguous hole is 8 KB, so E cannot load. That is external fragmentation: enough free memory, just not in one piece.",
      ru: "E нужно 12 КБ. Свободно ровно 12 КБ, но самая большая непрерывная дыра — 8 КБ, поэтому E не загрузить. Это внешняя фрагментация: свободной памяти хватает, но не одним куском." },
    { t: ["Compaction", "Уплотнение"], blocks: [["A", 0, 12], ["C", 12, 12, 20], ["D", 24, 4, 32], ["E", 28, 12, null, 1]],
      en: "One fix is compaction: move C and D down so the holes merge. But moving a process means copying all its memory while it is paused, and every absolute address inside it becomes wrong.",
      ru: "Одно решение — уплотнение: сдвинуть C и D вниз, чтобы дыры слились. Но перенос процесса — это копирование всей его памяти, пока он стоит, и все абсолютные адреса внутри него становятся неверными." },
    { t: ["Paging", "Страничная организация"], blocks: [["A", 0, 12], ["C", 20, 12], ["D", 32, 4]], pages: [12, 16, 36],
      en: "Virtual memory solves it differently. Memory is cut into 4 KB pages, and E's three pages go into any free frames: 12, 16 and 36 KB. E still sees one contiguous range from 0 to 12 KB, and the page table hides where the pieces really are.",
      ru: "Виртуальная память решает это иначе. Память нарезана на страницы по 4 КБ, и три страницы E ложатся в любые свободные кадры: 12, 16 и 36 КБ. E по-прежнему видит один непрерывный диапазон от 0 до 12 КБ, а таблица страниц скрывает, где куски лежат на самом деле." },
    { t: ["Internal fragmentation", "Внутренняя фрагментация"], blocks: [["A", 0, 12], ["C", 20, 12], ["D", 32, 4]], pages: [12, 16, 36], used: 9,
      en: "The price is internal fragmentation. E really needs 9 KB, but memory is handed out in whole pages, so it gets 12 KB, and 3 KB of its last page is wasted inside the allocation. On average half a page per region: small and predictable, unlike external fragmentation.",
      ru: "Цена — внутренняя фрагментация. На самом деле E нужно 9 КБ, но память выдаётся целыми страницами, поэтому E получает 12 КБ, и 3 КБ её последней страницы пропадают внутри выделения. В среднем полстраницы на область: мало и предсказуемо, в отличие от внешней фрагментации." }
  ];
  const X0 = 40, W = 680, KB = W / 40, PY = 210, VY = 92;
  return steppedAnim(el, { title: LL("External vs internal fragmentation", "Внешняя и внутренняя фрагментация"), vb: [760, 330], steps: ST, render(g, s, t){
    const k = easeIO(Math.min(1, t / 1500));
    oT(g, X0, PY - 12, LL("Physical memory (40 KB)", "Физическая память (40 КБ)"), "an-m an-b", "start");
    oR(g, X0, PY, W, 48, "an-frame", 4);
    for(let kb = 0; kb <= 40; kb += 4){ E(g, "line", { x1: X0 + kb * KB, y1: PY + 48, x2: X0 + kb * KB, y2: PY + 54, class: "an-link2" }); oT(g, X0 + kb * KB, PY + 68, String(kb), "an-m"); }
    oT(g, X0 + W, PY + 84, "KB", "an-m", "end");
    for(const [n, at, size, from, appear] of s.blocks){
      const a = from == null ? at : from + (at - from) * k;
      if(appear && k < .98) continue;
      oR(g, X0 + a * KB + 1, PY + 2, size * KB - 2, 44, "an-pg " + C[n], 4); oT(g, X0 + (a + size / 2) * KB, PY + 29, n, "an-t an-b");
    }
    if(s.hole){ const [a, size] = s.hole; oT(g, X0 + (a + size / 2) * KB, PY + 29, LL("hole 8 KB", "дыра 8 КБ"), "an-m an-b"); }
    if(s.want){
      oR(g, X0 + 12 * KB, VY, 12 * KB, 44, "an-leak", 4); oT(g, X0 + 18 * KB, VY + 27, LL("E needs 12 KB contiguous", "E нужно 12 КБ подряд"), "an-t an-b an-warn");
      oT(g, X0 + 16 * KB, PY + 100, LL("free: 8 KB + 4 KB = 12 KB, largest hole 8 KB", "свободно: 8 КБ + 4 КБ = 12 КБ, наибольшая дыра 8 КБ"), "an-m an-b an-warn");
    }
    if(s.pages){
      oT(g, X0, VY - 12, LL("E's virtual address space", "виртуальное адресное пространство E"), "an-m an-b", "start");
      s.pages.forEach((p, i)=>{
        const vx = X0 + i * 4 * KB, kk = Math.max(0, Math.min(1, k * 3 - i));
        oR(g, vx + 1, VY, 4 * KB - 2, 44, "an-pg " + C.E, 4); oT(g, vx + 2 * KB, VY + 27, `E.P${i + 1}`, "an-t an-b");
        const tx = X0 + p * KB;
        E(g, "path", { d: `M${vx + 2 * KB} ${VY + 44}C${vx + 2 * KB} ${VY + 80},${tx + 2 * KB} ${PY - 40},${tx + 2 * KB} ${PY}`, class: "an-link2 on" });
        if(kk > 0){ oR(g, tx + 1, PY + 2, 4 * KB - 2, 44, "an-pg " + C.E, 4); oT(g, tx + 2 * KB, PY + 29, `E.P${i + 1}`, "an-t an-b"); }
        if(s.used && i === 2){
          const ux = (9 - 8) * KB;
          for(const X of [vx, tx]) { oR(g, X + ux, (X === vx ? VY : PY + 2), 4 * KB - ux - 1, 44, "an-leak", 3); }
          oT(g, vx + ux + (4 * KB - ux) / 2, VY + 62, LL("3 KB wasted", "3 КБ впустую"), "an-m an-b an-warn");
        }
      });
      oT(g, X0 + 12 * KB + 8, VY + 27, LL("0 – 12 KB, contiguous", "0 – 12 КБ, непрерывно"), "an-m", "start");
    }
  }});
};

ANIMS["cpu-pipeline"] = el=>{
  const S4 = ["F", "D", "X", "W"], CLS = { F: "k1", D: "k3", X: "k0", W: "k2" };
  const run = (starts, extra = {}) => starts.map((c0, i) => { const ops = []; let c = c0; for(const st of S4){ const w = (extra[i] || {})[st] || 0; for(let b = 0; b < w; b++) ops.push([c++, "-"]); ops.push([c++, st]); } return ops; });
  const ST = [
    { t: ["Without a pipeline", "Без конвейера"], rows: run([1, 5, 9]), names: ["i1", "i2", "i3"], en: "Each instruction goes through fetch, decode, execute and write before the next one starts. Three instructions take 12 cycles, and each unit works only 1 cycle in 4.",
      ru: "Каждая инструкция проходит выборку, декодирование, выполнение и запись, прежде чем начнётся следующая. Три инструкции занимают 12 тактов, и каждый блок работает лишь 1 такт из 4." },
    { t: ["Pipelined", "Конвейер"], rows: run([1, 2, 3, 4, 5, 6]), names: ["i1", "i2", "i3", "i4", "i5", "i6"], en: "While i1 is decoded, i2 is fetched; while i1 executes, i2 is decoded and i3 fetched. After the pipeline fills, one instruction finishes every cycle: six in 9 cycles. No single instruction got faster; throughput went up 4×.",
      ru: "Пока i1 декодируется, выбирается i2; пока i1 выполняется, декодируется i2 и выбирается i3. Когда конвейер заполнен, каждый такт завершается одна инструкция: шесть за 9 тактов. Ни одна инструкция не стала быстрее; пропускная способность выросла в 4 раза." },
    { t: ["Data hazard", "Конфликт по данным"], rows: run([1, 2, 3, 4, 5], { 2: { X: 2 }, 3: { D: 2 }, 4: { F: 2 } }), names: ["i1 add", "i2 ldr r1", "i3 mul r1", "i4", "i5"], en: "i3 multiplies r1, which i2 is still loading from memory. i3 cannot execute until the value arrives, so it waits 2 cycles (bubbles), and everything behind it waits too. Forwarding passes a result straight to the next instruction, but a load from memory still costs its full latency.",
      ru: "i3 умножает r1, который i2 ещё загружает из памяти. i3 не может выполниться, пока значение не придёт, поэтому ждёт 2 такта (пузыри), и всё, что за ней, тоже ждёт. Проброс (forwarding) передаёт результат сразу следующей инструкции, но загрузка из памяти всё равно стоит свою полную задержку." },
    { t: ["Branch misprediction", "Неверное предсказание перехода"], rows: [...run([1, 2, 3]), [[4, "xF"], [5, "xD"]], [[5, "xF"]], ...run([6, 7])],
      names: ["i1", "i2", "i3 jne", "i4 ✗", "i5 ✗", "t1", "t2"], en: "i3 is a conditional jump. The predictor guessed \"not taken\", so i4 and i5 were fetched. At execute (cycle 5) i3 turns out to jump: i4 and i5 are thrown away and fetching restarts at the target t1. Here it costs 2 cycles; on a real 15–20-stage pipeline about 15.",
      ru: "i3 — условный переход. Предсказатель решил «не переходить», поэтому были выбраны i4 и i5. На выполнении (такт 5) выясняется, что i3 переходит: i4 и i5 выбрасываются, и выборка начинается заново с цели t1. Здесь это стоит 2 такта, на настоящем конвейере из 15–20 стадий — около 15." },
    { t: ["Superscalar", "Суперскалярность"], rows: run([1, 1, 2, 2, 3, 3, 4, 4]), names: ["i1", "i2", "i3", "i4", "i5", "i6", "i7", "i8"], en: "A modern core has several of each unit and starts several independent instructions per cycle (4–8 wide), out of order when needed. Eight instructions finish in 7 cycles. Real code reaches 1–3 instructions per cycle, because dependencies, misses and mispredictions cut in.",
      ru: "В современном ядре по несколько блоков каждого вида, и оно запускает несколько независимых инструкций за такт (ширина 4–8), при необходимости вне порядка. Восемь инструкций завершаются за 7 тактов. Реальный код достигает 1–3 инструкций за такт, потому что мешают зависимости, промахи и ошибки предсказания." }
  ];
  const X0 = 110, CW = 46, RH = 26, Y0 = 56, NC = 13;
  return steppedAnim(el, { title: LL("Pipelining and its hazards", "Конвейер и его конфликты"), vb: [760, 320], steps: ST, stepMs: 6400, render(g, s, t){
    const shown = Math.min(NC, Math.floor(t / 320) + 1);
    oT(g, X0 - 10, 40, LL("cycle", "такт"), "an-m an-b", "end");
    for(let c = 1; c <= NC - 1; c++) oT(g, X0 + (c - .5) * CW, 40, String(c), "an-m" + (c <= shown ? " an-b" : ""));
    s.rows.forEach((ops, r)=>{
      const y = Y0 + r * RH;
      oT(g, X0 - 10, y + 17, s.names[r], "an-code", "end");
      for(const [c, st] of ops){
        if(c > shown || c >= NC) continue;
        const x = X0 + (c - 1) * CW;
        if(st === "-"){ oR(g, x + 2, y + 2, CW - 4, RH - 4, "an-free", 4); oT(g, x + CW / 2, y + 17, LL("wait", "ждёт"), "an-m"); continue; }
        if(st[0] === "x"){ oR(g, x + 2, y + 2, CW - 4, RH - 4, "an-leak", 4); oT(g, x + CW / 2, y + 17, st[1], "an-t an-b an-warn"); continue; }
        oR(g, x + 2, y + 2, CW - 4, RH - 4, "an-pg " + CLS[st], 4); oT(g, x + CW / 2, y + 17, st, "an-t an-b");
      }
    });
    E(g, "line", { x1: X0 + shown * CW, y1: 46, x2: X0 + shown * CW, y2: Y0 + s.rows.length * RH, class: "an-flowline" });
    const ly = 300; [["F", LL("fetch", "выборка")], ["D", LL("decode", "декодирование")], ["X", LL("execute", "выполнение")], ["W", LL("write", "запись")]].forEach(([st, l], i)=>{ oR(g, 20 + i * 160, ly - 13, 18, 18, "an-pg " + CLS[st], 3); oT(g, 44 + i * 160, ly + 1, l, "an-m", "start"); });
    const done = s.rows.filter(ops => ops.length >= 4 && !ops.some(o => o[1][0] === "x") && ops[ops.length - 1][0] <= shown).length;
    oT(g, 740, 40, LL(`finished: ${done}`, `завершено: ${done}`), "an-m an-b", "end");
  }});
};

// ============ 23. Parallelism: one core vs many, Amdahl, oversubscription, SMT
ANIMS["cpu-parallelism"] = el=>{
  const ST = [
    { t: ["One big task", "Одна большая задача"], mode: 0, en: "A single-threaded program runs on one core, however many the machine has. CPU 2 sits idle. The task takes 8 seconds.",
      ru: "Однопоточная программа работает на одном ядре, сколько бы их ни было в машине. CPU 2 простаивает. Задача занимает 8 секунд." },
    { t: ["Split across cores", "Разделение по ядрам"], mode: 1, en: "Split the task into two processes or threads, and the OS scheduler puts each on its own core. They truly run at the same time: 4 seconds. That is parallelism; concurrency is only interleaving, which one core can also do.",
      ru: "Разделите задачу на два процесса или потока, и планировщик ОС поставит каждый на своё ядро. Они действительно работают одновременно: 4 секунды. Это параллелизм; конкурентность — лишь чередование, которое умеет и одно ядро." },
    { t: ["The serial part (Amdahl)", "Последовательная часть (Амдал)"], mode: 2, en: "Real tasks have a part that cannot be split: reading the input, merging results, a shared lock. With 20% serial work, 2 cores give 8 → 4.8 s (1.7×), not 4 s, and even infinite cores cannot beat 1.6 s (5×). That is Amdahl's law.",
      ru: "У реальных задач есть часть, которую нельзя разделить: чтение входа, слияние результатов, общая блокировка. При 20% последовательной работы 2 ядра дают 8 → 4,8 с (в 1,7 раза), а не 4 с, и даже бесконечное число ядер не опустится ниже 1,6 с (в 5 раз). Это закон Амдала." },
    { t: ["More threads than cores", "Потоков больше, чем ядер"], mode: 3, en: "Four CPU-bound threads on two cores do not finish sooner: the scheduler time-slices them, and every switch adds overhead and cold caches. For CPU-bound work, size the pool to the number of cores; I/O-bound threads spend most of their time blocked, so more of them help.",
      ru: "Четыре потока, загружающих CPU, на двух ядрах не закончат раньше: планировщик делит между ними время, и каждое переключение добавляет накладные расходы и холодные кэши. Для вычислительной работы размер пула — по числу ядер; потоки, ждущие ввода-вывода, почти всё время заблокированы, поэтому их может быть больше." },
    { t: ["Hyper-threading (SMT)", "Hyper-threading (SMT)"], mode: 4, en: "One physical core can run two hardware threads that share its ALUs and caches. When one thread stalls on a cache miss, the other uses the idle units. It gains maybe 10–30%, not 2×. A \"vCPU\" in the cloud is one such hardware thread.",
      ru: "Одно физическое ядро может выполнять два аппаратных потока, которые делят его ALU и кэши. Когда один поток стоит на промахе кэша, другой использует свободные блоки. Выигрыш около 10–30%, а не в 2 раза. «vCPU» в облаке — это один такой аппаратный поток." }
  ];
  const X0 = 150, W = 560, SEC = W / 8;
  return steppedAnim(el, { title: LL("Parallelism: cores, threads, limits", "Параллелизм: ядра, потоки, пределы"), vb: [760, 300], steps: ST, stepMs: 6400, render(g, s, t){

      oT(g, X0 - 12, y + 22, label, "an-t an-b", "end"); oR(g, X0, y, W, 34, "an-frame", 5);
      for(const [a, b, cls, txt] of segs){ const from = X0 + a * SEC, to = X0 + Math.min(b, Math.max(a, k * 8)) * SEC; if(to - from < 3) continue; oR(g, from + 1, y + 2, to - from - 2, 30, "an-pg " + cls, 4); if(txt && to - from > 40) oT(g, (from + to) / 2, y + 22, txt, "an-m an-b"); }
    };
    for(let sec = 0; sec <= 8; sec++){ oT(g, X0 + sec * SEC, 28, sec + LL(" s", " с"), "an-m"); E(g, "line", { x1: X0 + sec * SEC, y1: 34, x2: X0 + sec * SEC, y2: 230, class: "an-link2 an-dash" }); }
    if(s.mode === 0){ lane(50, "CPU 1", [[0, 8, "k1", LL("big task", "большая задача")]]); lane(100, "CPU 2", []); oT(g, X0 + W / 2, 122, LL("idle", "простаивает"), "an-m"); }
    if(s.mode === 1){ lane(50, "CPU 1", [[0, 4, "k1", LL("process 1", "процесс 1")]]); lane(100, "CPU 2", [[0, 4, "k2", LL("process 2", "процесс 2")]]); if(k * 8 >= 4) oT(g, X0 + 4 * SEC + 8, 176, LL("done in 4 s: 2×", "готово за 4 с: в 2 раза"), "an-t an-b", "start"); }
    if(s.mode === 2){ lane(50, "CPU 1", [[0, .8, "k4", LL("serial", "посл.")], [.8, 4, "k1", LL("half 1", "половина 1")], [4, 4.8, "k4", LL("merge", "слияние")]]); lane(100, "CPU 2", [[.8, 4, "k2", LL("half 2", "половина 2")]]);
      if(k * 8 >= 4.8) oT(g, X0 + 4.8 * SEC + 8, 176, LL("4.8 s: 1.7×, not 2×", "4,8 с: в 1,7 раза, а не в 2"), "an-t an-b an-warn", "start");
      oT(g, X0, 216, LL("speedup = 1 / (serial + parallel / cores)", "ускорение = 1 / (посл. + парал. / ядра)"), "an-code", "start"); }
    if(s.mode === 3){ const segs = c => { const o = []; for(let q = 0; q < 16; q++){ const th = (q % 2) + c * 2; o.push([q * .5, q * .5 + .5, ["k1", "k2", "k0", "k3"][th], "T" + (th + 1)]); } return o; };
      lane(50, "CPU 1", segs(0)); lane(100, "CPU 2", segs(1)); oT(g, X0, 176, LL("4 threads × 2 s of work = 8 s of CPU, still 4 s on 2 cores, plus switch overhead", "4 потока × 2 с работы = 8 с CPU, всё равно 4 с на 2 ядрах, плюс переключения"), "an-m an-b", "start"); }
    if(s.mode === 4){ const segs = th => { const o = []; for(let q = 0; q < 8; q++){ const run = (q + th) % 2 === 0; o.push([q, q + (run ? .85 : .25), run ? (th ? "k2" : "k1") : "k4", run ? ("T" + (th + 1)) : LL("miss", "промах")]); } return o; };
      lane(50, LL("core 1, HT 1", "ядро 1, HT 1"), segs(0)); lane(100, LL("core 1, HT 2", "ядро 1, HT 2"), segs(1));
      oT(g, X0, 176, LL("the ALUs are shared: one thread runs while the other waits on memory", "ALU общие: один поток работает, пока другой ждёт память"), "an-m an-b", "start"); }
  }});

// ============ networking: traceroute-ttl
ANIMS["traceroute-ttl"] = el=>{

    { t: ["Probe with TTL 1", "Проба с TTL 1"], ttl: 1, stop: 1, back: "time", rows: 0,

    { t: ["Hop 1: Time Exceeded", "Хоп 1: Time Exceeded"], ttl: 1, stop: 1, back: "time", reply: true, rows: 1,

      ru: "R1 уменьшает TTL до 0, отбрасывает пробу и отправляет обратно ICMP типа 11 Time Exceeded со своего адреса. traceroute печатает этот адрес источника как хоп 1 вместе с измеренным временем туда-обратно. На каждый хоп уходят три пробы, поэтому времени три." },
    { t: ["TTL 2 reaches R2", "TTL 2 доходит до R2"], ttl: 2, stop: 2, back: "time", reply: true, rows: 2,

      ru: "Следующая проба с TTL = 2: R1 пересылает её с TTL 1, R2 уменьшает до 0 и отвечает. Каждый шаг открывает ещё один маршрутизатор. 100.64.0.1 — адрес carrier-grade NAT: сеть твоего провайдера." },
    { t: ["Silent hop: * * *", "Молчаливый хоп: * * *"], ttl: 3, stop: 3, back: "none", rows: 3,
      en: "R3 drops the probe but sends nothing back (or rate-limits ICMP generation), so traceroute prints * * * after a timeout. The path is not broken: the next probe goes further. Stars only matter if every hop after them is stars too.",
      ru: "R3 отбрасывает пробу, но ничего не отвечает (или ограничивает частоту генерации ICMP), поэтому traceroute после тайм-аута печатает * * *. Путь не оборван: следующая проба идёт дальше. Звёздочки важны, только если все хопы после них тоже звёздочки." },
    { t: ["Destination answers", "Отвечает назначение"], ttl: 4, stop: 4, back: "unreach", reply: true, rows: 4,
      en: "With TTL = 4 the probe reaches the server. Nobody listens on UDP port 33434+, so the server answers ICMP type 3 code 3 Port Unreachable, and traceroute knows it has arrived. With -I the server sends an Echo Reply instead; with -T a SYN-ACK or RST.",
      ru: "С TTL = 4 проба доходит до сервера. На UDP-порту 33434+ никто не слушает, поэтому сервер отвечает ICMP типа 3 кода 3 Port Unreachable, и traceroute понимает, что дошёл. С -I сервер присылает Echo Reply, с -T — SYN-ACK или RST." },
    { t: ["Reading the result", "Как читать результат"], ttl: 0, stop: 0, back: "none", rows: 4, all: true,
      en: "Each line is a hop and its round-trip time. RTT is the full round trip from you to that router and back, and replies may take a different return path, so a slow middle hop with fast later hops usually means that router deprioritises ICMP, not that the path is slow. mtr runs the same probes continuously and shows loss per hop.",
      ru: "Каждая строка — хоп и время туда-обратно. RTT — полный путь от тебя до маршрутизатора и обратно, причём ответы могут идти другим путём, поэтому медленный средний хоп при быстрых следующих обычно значит, что маршрутизатор понижает приоритет ICMP, а не что путь медленный. mtr шлёт те же пробы непрерывно и показывает потери на каждом хопе." }

      if(s.reply && k1 >= 1){
        const back = pts.slice().reverse().map(([x]) => [x, Y + HH + 30]);

        E(g, "circle", { cx: bx, cy: by, r: 8, class: "an-dot an-ack" });
        oT(g, bx, by + 22, s.back === "time" ? LL("ICMP 11 Time Exceeded", "ICMP 11 Time Exceeded") : LL("ICMP 3/3 Port Unreachable", "ICMP 3/3 Port Unreachable"), "an-m an-b");
      }
    }
    // output table
    oR(g, 20, 182, 720, 166, "an-frame", 8);
    oT(g, 32, 202, "$ traceroute -n 93.184.216.34", "an-code", "start");

      const y = 228 + i * 28, star = ip.startsWith("*"), cur = i === s.rows - 1 && !s.all;

      ru: "На этот раз ACK вообще не возвращаются, и срабатывает таймер повторной передачи (RTO, в Linux минимум 200 мс). Это сигнал сильной перегрузки: ssthresh = cwnd / 2 = 8, cwnd падает до 1 сегмента, и медленный старт начинается заново. Пользователи видят это как всплеск задержки." },
    { t: ["Slow start up to the new ssthresh", "Медленный старт до нового ssthresh"], n: 24, th: 8, loss: true, rto: true,
      en: "Doubling up to the new ssthresh of 8, then linear again. The same reset happens without any loss after an idle period longer than the RTO (tcp_slow_start_after_idle = 1), which is why idle pooled connections feel slow on the next burst.",
      ru: "Удвоение до нового ssthresh = 8, затем снова линейно. Такой же сброс происходит и без потерь после простоя дольше RTO (tcp_slow_start_after_idle = 1), поэтому простаивающие соединения из пула медленны на следующем всплеске." },
    { t: ["CUBIC instead of Reno", "CUBIC вместо Reno"], n: 24, th: 8, loss: true, cubic: true,
      en: "Linux's default, CUBIC, makes the window a cubic function of the time since the last loss: after cutting to 0.7 × W_max it climbs fast, flattens near the old maximum W_max, then probes upward faster again. It recovers bandwidth much quicker on long, fat links. BBR goes further and ignores loss, pacing by measured bandwidth and minimum RTT.",
      ru: "CUBIC, алгоритм Linux по умолчанию, делает окно кубической функцией от времени с последней потери: после урезания до 0,7 × W_max оно быстро растёт, выравнивается около прежнего максимума W_max, а потом снова ускоряется вверх. На длинных и широких каналах он гораздо быстрее возвращает пропускную способность. BBR идёт дальше и не смотрит на потери, задавая темп по измеренной пропускной способности и минимальному RTT." }
  ];
  const X = r => 60 + r * 28.8, Y = v => 300 - v * 8.125, RW = 31;
  const PH = [[0, 4, "slow start", "медл. старт", true], [4, 12, "congestion avoidance: +1 / RTT", "избегание перегрузки: +1 / RTT"], [12, 17, "fast recovery → +1 / RTT", "fast recovery → +1 / RTT"], [18, 21, "slow start", "медл. старт", true]];
  return steppedAnim(el, { title: LL("Congestion window over time", "Окно перегрузки во времени"), vb: [760, 340], steps: ST, stepMs: 7000, render(g, s, t, i){
    const p = i > 0 ? ST[i - 1] : { n: 0, th: s.th };
    const from = Math.min(p.n, s.n), add = s.n - from, shown = add > 0 ? from + add * Math.min(1, t / (450 * add)) : s.n;
    const k = easeIO(Math.min(1, t / 1200));
    // phase bands
    if(!s.cubic) for(const [a, b, en, ru, ss] of PH){ if(shown - 1 <= a) continue;
      const bb = Math.min(b, shown - 1);
      if(ss) oR(g, X(a), 40, X(bb) - X(a), 260, "an-rowhl", 0);
      oT(g, (X(a) + X(b)) / 2, 72, LL(en, ru), "an-m an-b"); }
    // axes and grid
    E(g, "line", { x1: 60, y1: 300, x2: 730, y2: 300, class: "an-link2" }); E(g, "line", { x1: 60, y1: 40, x2: 60, y2: 300, class: "an-link2" });
    for(let r = 0; r <= 22; r += 2) oT(g, X(r), 316, String(r), "an-m");
    oT(g, 730, 316, LL("RTT →", "RTT →"), "an-m an-b", "end");
    for(let v = 0; v <= 32; v += 8){ oT(g, 52, Y(v) + 4, String(v), "an-m", "end"); if(v) E(g, "line", { x1: 60, y1: Y(v), x2: 730, y2: Y(v), class: "an-lane" }); }
    oT(g, 14, 34, LL("cwnd, segments", "cwnd, сегменты"), "an-m an-b", "start");
    // rwnd: the receiver's cap
    E(g, "line", { x1: 60, y1: Y(RW), x2: 730, y2: Y(RW), class: "an-hw" });
    oT(g, 726, Y(RW) - 6, LL("rwnd: receiver limit · in flight = min(cwnd, rwnd)", "rwnd: лимит получателя · в полёте = min(cwnd, rwnd)"), "an-m an-b", "end");
    // ssthresh line, sliding when it changes
    const th = p.th + (s.th - p.th) * k;
    E(g, "line", { x1: 60, y1: Y(th), x2: 730, y2: Y(th), class: "an-limit" + (p.th !== s.th ? " on" : "") });
    oT(g, 66, Y(th) - 6, `ssthresh = ${Math.round(th)}`, "an-m an-b an-warn", "start");
    // cwnd trace (Reno), drawn up to a fractional point
    const full = Math.floor(shown), pts = [];
    for(let j = 0; j < Math.min(full, W.length); j++) pts.push([X(j), Y(W[j])]);
    if(full < s.n && full > 0){ const f = shown - full; pts.push([X(full - 1 + f), Y(W[full - 1] + (W[full] - W[full - 1]) * f)]); }
    const cut = s.cubic ? 13 : pts.length;
    if(pts.length > 1) E(g, "polyline", { points: pts.slice(0, cut).map(q => q.join(",")).join(" "), class: "an-link2 on", fill: "none" });
    if(s.cubic && pts.length > 13) E(g, "polyline", { points: pts.slice(12).map(q => q.join(",")).join(" "), class: "an-link2 on an-dim", fill: "none" });
    pts.slice(0, s.cubic ? 13 : Math.min(full, W.length)).forEach(([x, y])=>E(g, "circle", { cx: x, cy: y, r: 3.5, class: "an-dot an-flow" }));
    // loss and timeout markers
    if(s.loss){ oT(g, X(12), Y(24) - 10, LL("✕ 3 dup ACKs", "✕ 3 дубл. ACK"), "an-m an-b an-warn"); }
    if(s.rto){ oT(g, X(17) - 4, Y(16) - 10, LL("✕ RTO", "✕ RTO"), "an-m an-b an-warn", "end"); }
    // CUBIC overlay: W(t) = C (t − K)^3 + W_max, W_max = 24, starts at 0.7 × W_max
    if(s.cubic){
      const Wm = 24, C = 0.0576, K = Math.cbrt(Wm * 0.3 / C), cp = [];
      const end = 9 * k;
      for(let x = 0; x <= end + 1e-9; x += 0.25) cp.push([X(12 + x), Y(C * Math.pow(x - K, 3) + Wm)]);
      E(g, "line", { x1: X(12), y1: Y(Wm), x2: 730, y2: Y(Wm), class: "an-hw" });
      oT(g, 726, Y(Wm) + 14, "W_max", "an-m an-b", "end");
      if(cp.length > 1) E(g, "polyline", { points: cp.map(q => q.join(",")).join(" "), class: "an-map s2", fill: "none", style: "stroke-width:3" });
      oT(g, X(16.5), 70, LL("CUBIC: concave, plateau near W_max, then convex", "CUBIC: вогнутый рост, плато у W_max, затем выпуклый"), "an-m an-b");
      oT(g, X(19.5), Y(9), LL("Reno (faded)", "Reno (бледно)"), "an-m");
    }
    // readout
    const cur = Math.max(0, Math.min(W.length - 1, Math.ceil(shown) - 1));
    const phase = s.cubic ? "CUBIC" : (cur <= 4 || (cur >= 18 && cur <= 21)) ? LL("slow start", "медленный старт") : LL("congestion avoidance", "избегание перегрузки");
    if(s.cubic) oT(g, 380, 22, LL("W_max = 24 · after loss: cwnd = 0.7 × 24 ≈ 17 · then cubic growth", "W_max = 24 · после потери: cwnd = 0,7 × 24 ≈ 17 · затем кубический рост"), "an-t an-b");
    else oT(g, 380, 22, LL(`RTT ${cur} · cwnd = ${W[cur]} · ssthresh = ${s.th} · ${phase}`, `RTT ${cur} · cwnd = ${W[cur]} · ssthresh = ${s.th} · ${phase}`), "an-t an-b");
  }});
};
